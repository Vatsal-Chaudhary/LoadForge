global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/loadforge.rules.yaml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "loadforge-aggregator"
    static_configs:
      - targets: ["aggregator:9090"]

  - job_name: "loadforge-orchestrator"
    static_configs:
      - targets: ["orchestrator:9101"]

  - job_name: "loadforge-apiserver"
    static_configs:
      - targets: ["apiserver:8080"]
