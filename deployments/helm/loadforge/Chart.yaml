apiVersion: v2
name: loadforge
description: Distributed load testing control plane for Kubernetes
type: application
version: 0.8.0
appVersion: "0.8.0"
dependencies:
  - name: postgresql
    version: ">=16.0.0 <18.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: ">=25.0.0 <28.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: nats
    version: ">=9.0.0 <10.0.0"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: nats.enabled
