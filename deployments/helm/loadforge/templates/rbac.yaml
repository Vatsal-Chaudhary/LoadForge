# Pod privileges are defined in a ClusterRole but namespace-scoped by this
# RoleBinding. Lease privileges are a separate Role so pod privileges are not
# accidentally granted in the control-plane namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "loadforge.fullname" . }}-worker-pods
  labels: {{- include "loadforge.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "update", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loadforge.fullname" . }}-worker-pods
  namespace: {{ .Values.worker.namespace }}
  labels: {{- include "loadforge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "loadforge.fullname" . }}-worker-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "loadforge.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loadforge.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "loadforge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loadforge.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "loadforge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loadforge.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "loadforge.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
