apiVersion: v1
kind: Pod
metadata:
  name: {{ include "loadforge.fullname" . }}-connectivity-test
  labels: {{- include "loadforge.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: connectivity
      image: {{ .Values.test.image | quote }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          wget -qO- http://{{ include "loadforge.fullname" . }}-apiserver:{{ .Values.apiserver.service.port }}/healthz
          wget -qO- http://{{ include "loadforge.fullname" . }}-aggregator:9090/healthz
          nc -z -w 5 {{ include "loadforge.fullname" . }}-orchestrator 50051
          nc -z -w 5 {{ if .Values.nats.enabled }}{{ .Release.Name }}-nats{{ else }}{{ (urlParse .Values.external.natsURL).host | trimSuffix ":4222" }}{{ end }} 4222
