apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loadforge.fullname" . }}-apiserver
  labels: {{- include "loadforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels: {{- include "loadforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels: {{- include "loadforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
    spec:
      serviceAccountName: {{ include "loadforge.fullname" . }}-apiserver
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apiserver
          image: {{ include "loadforge.image" .Values.images.apiserver | quote }}
          imagePullPolicy: {{ .Values.images.apiserver.pullPolicy }}
          {{- if .Values.postgresql.enabled }}
          command: ["/bin/sh", "-ec"]
          args:
            - 'export POSTGRES_DSN="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@{{ include "loadforge.postgresHost" . }}:5432/${POSTGRES_DATABASE}?sslmode=disable"; exec /app/apiserver'
          {{- end }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: ORCHESTRATOR_ADDR, value: {{ printf "%s-orchestrator:50051" (include "loadforge.fullname" .) | quote }}}
            - {name: API_RATE_LIMIT_RPS, value: {{ .Values.apiserver.rateLimitRPS | quote }}}
            - {name: API_RATE_LIMIT_BURST, value: {{ .Values.apiserver.rateLimitBurst | quote }}}
            - name: API_KEY_PEPPER
              valueFrom: {secretKeyRef: {name: {{ include "loadforge.fullname" . }}-secrets, key: API_KEY_PEPPER}}
            - name: NATS_URL
              valueFrom: {configMapKeyRef: {name: {{ include "loadforge.fullname" . }}-config, key: NATS_URL}}
            - name: REDIS_ADDR
              valueFrom: {configMapKeyRef: {name: {{ include "loadforge.fullname" . }}-config, key: REDIS_ADDR}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "loadforge.fullname" . }}-secrets, key: REDIS_PASSWORD}}
            {{- if .Values.postgresql.enabled }}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.auth.username | quote }}}
            - {name: POSTGRES_DATABASE, value: {{ .Values.postgresql.auth.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-postgresql, key: password}}
            {{- else }}
            - name: POSTGRES_DSN
              valueFrom: {secretKeyRef: {name: {{ include "loadforge.fullname" . }}-secrets, key: POSTGRES_DSN}}
            {{- end }}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {{ toYaml .Values.apiserver.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 1000
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loadforge.fullname" . }}-apiserver
  labels: {{- include "loadforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  type: {{ .Values.apiserver.service.type }}
  selector: {{- include "loadforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
  ports: [{name: http, port: {{ .Values.apiserver.service.port }}, targetPort: http}]
