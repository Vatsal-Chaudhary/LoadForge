{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "loadforge.fullname" .)) -}}
{{- $pepper := .Values.secrets.apiKeyPepper -}}
{{- if and (empty $pepper) $existing -}}{{- $pepper = (index $existing.data "API_KEY_PEPPER" | b64dec) -}}{{- end -}}
{{- if empty $pepper -}}{{- $pepper = randAlphaNum 48 -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loadforge.fullname" . }}-secrets
  labels: {{- include "loadforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY_PEPPER: {{ $pepper | quote }}
  POSTGRES_DSN: {{ if .Values.postgresql.enabled }}""{{ else }}{{ required "secrets.externalPostgresDSN is required when postgresql.enabled=false" .Values.secrets.externalPostgresDSN | quote }}{{ end }}
  POSTGRES_PASSWORD: {{ ternary .Values.postgresql.auth.password .Values.secrets.postgresPassword .Values.postgresql.enabled | quote }}
  REDIS_PASSWORD: {{ ternary .Values.redis.auth.password .Values.secrets.redisPassword .Values.redis.enabled | quote }}
